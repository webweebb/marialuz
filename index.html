<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="María Luz — Sitio en preparación.">
  <title>María Luz</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #faf7f2; color: #463e36; font-family: Arial, sans-serif; }
    main { width: 100%; max-width: 600px; padding: clamp(32px, 8vw, 64px) 24px; text-align: center; background: #fffdf9; border: 1px solid #e8dfd2; border-radius: 24px; }
    h1 { margin: 0 0 16px; font-family: Georgia, serif; font-size: clamp(40px, 9vw, 64px); font-weight: normal; }
    p { margin: 0; font-size: 18px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>María Luz</h1>
    <p>Estamos preparando este espacio con mucho cariño.<br>Muy pronto vas a encontrar novedades acá.</p>
  </main>
</body>
</html>
